[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "streamplify-linux"
version = "0.1.0"
description = "Linux client for the Streamplify DECK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["hid>=1.0.5", "pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
streamplify = "streamplify.cli:main"

[tool.setuptools.package-data]
streamplify = ["example.toml", "icons/*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
